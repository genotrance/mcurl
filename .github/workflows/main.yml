name: CI

on:
  push:
    branches:
      - main
      - devel
      - working
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - all Python versions
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: ubuntu-latest
            python-version: "pypy3.11"
          # Linux aarch64 - native ARM runners
          - os: ubuntu-24.04-arm
            python-version: "3.9"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
          - os: ubuntu-24.04-arm
            python-version: "3.14"
          - os: ubuntu-24.04-arm
            python-version: "3.15"
          - os: ubuntu-24.04-arm
            python-version: "pypy3.11"
          # macOS arm64
          - os: macos-15
            python-version: "3.9"
          - os: macos-15
            python-version: "3.10"
          - os: macos-15
            python-version: "3.11"
          - os: macos-15
            python-version: "3.12"
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
          - os: macos-15
            python-version: "3.15"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Update Homebrew libcurl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew upgrade curl || true
          EXPECTED=$(python3 -c "import pathlib, re; m = re.search(r'^version = \"([0-9]+\.[0-9]+\.[0-9]+)\.', pathlib.Path('pyproject.toml').read_text(), re.M); print(m.group(1))")
          INSTALLED=$("$(brew --prefix curl)/bin/curl" --version | sed -n '1s/curl \([^ ]*\).*/\1/p')
          test "$INSTALLED" = "$EXPECTED"

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set LD_LIBRARY_PATH for jbb libcurl (Linux)
        if: runner.os == 'Linux'
        run: |
          LIBCURL_VERSION=$(uv run --locked python -c 'version = next(line.split("=", 1)[1].strip().strip("\"") for line in open("pyproject.toml") if line.startswith("version")); print(version.rsplit(".", 1)[0])')
          LIB_DIRS=$(uv run --locked python -m jbb -d "$RUNNER_TEMP/mcurl/$(uv run --locked python -c 'import jbb; print(jbb.get_key())')" -q -p genotrance "LibCURL-v$LIBCURL_VERSION")
          echo "LD_LIBRARY_PATH=${LIB_DIRS}:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set DYLD_LIBRARY_PATH for brew libcurl (macOS)
        if: runner.os == 'macOS'
        run: |
          PREFIX=$(brew --prefix)
          DIRS=$(brew deps -n --installed curl | grep -v ca-certificates | xargs -I{} echo "${PREFIX}/opt/{}/lib" | tr '\n' ':')${PREFIX}/opt/curl/lib
          echo "DYLD_LIBRARY_PATH=${DIRS}:${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run --locked python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

  tests-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            cibw_build: "cp39-win_amd64"
          - python-version: "3.12"
            cibw_build: "cp312-win_amd64"
          - python-version: "3.13"
            cibw_build: "cp313-win_amd64"
          - python-version: "3.14"
            cibw_build: "cp314-win_amd64"
          - python-version: "3.15"
            cibw_build: "cp315-win_amd64"
    name: test windows ${{ matrix.python-version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and test wheels (Windows)
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS: AMD64
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            uv pip install delvewheel "jbb>=0.1.6" &&
            python -c "import os, subprocess, jbb; version = next(line.split('=', 1)[1].strip().strip(chr(34)) for line in open('pyproject.toml') if line.startswith('version')); subprocess.call(['delvewheel', 'repair', '--add-path', os.path.pathsep.join(jbb.jbb(f'LibCURL-v{version.rsplit(chr(46), 1)[0]}', outdir=os.environ['TMP']+'\\mcurl\\'+jbb.get_key(), project='genotrance', quiet=True)), '-w', r'{dest_dir}', r'{wheel}'])"
          CIBW_TEST_REQUIRES: "pytest pytest-httpbin"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"
          CIBW_TEST_SKIP: ""

  tests-i686:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            cibw_build: "cp39-manylinux_i686"
          - python-version: "3.14"
            cibw_build: "cp314-manylinux_i686"
          - python-version: "3.15"
            cibw_build: "cp315-manylinux_i686"
    name: test linux i686 ${{ matrix.python-version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and test wheels (Linux i686)
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS: i686
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"
          CIBW_TEST_SKIP: ""
