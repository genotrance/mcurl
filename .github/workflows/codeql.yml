name: CodeQL

# Advanced setup runs for fork pull requests, unlike GitHub's default setup.
# Never trigger it with pull_request_target or workflow_run.
on:
  pull_request:
  push:
    branches: [devel, main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SETUPTOOLS_VERSION: "84.2.1"
  CFFI_VERSION: "2.1.1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Builds mcurl/gen.py's generated cffi extension against the distro
      # libcurl dev package so CodeQL traces the actual generated C, not just
      # vendored or boilerplate code. Uses the distro headers (not the
      # jbb-downloaded LibCURL the real wheel build uses): CodeQL only needs
      # a compilable translation unit, not the exact shipped ABI.
      - name: Install distro libcurl dev headers (c-cpp)
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Build the cffi extension (c-cpp)
        if: matrix.build-mode == 'manual'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "setuptools==$SETUPTOOLS_VERSION" "cffi==$CFFI_VERSION" "jbb>=0.1.6"
          "$RUNNER_TEMP/venv/bin/python" .github/codeql/build_ccpp.py

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
