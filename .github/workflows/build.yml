name: Build wheels

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build and release (defaults to the dispatched branch head)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and verify artifacts without uploading to PyPI or tagging"
        required: false
        default: false
        type: boolean

concurrency:
  # Keep actual main releases behind check-upstream.yml's version decision.
  group: ${{ inputs.dry_run && format('build-dry-run-{0}', github.run_id) || github.ref == 'refs/heads/main' && 'release-main' || format('build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            # Explicit commit: release exactly the version committed there.
            VERSION=$(python3 -c "import re, pathlib; text = pathlib.Path('pyproject.toml').read_text(); m = re.search(r'version = \"(.+?)\"', text); print(m.group(1))")
          else
          # Get latest LibCURL_jll.jl release and extract base version
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/genotrance/LibCURL_jll.jl/releases/latest" | grep '"tag_name":' | sed -E 's/.*"tag_name":\s*"([^"]+)".*/\1/')
          BASE_VERSION=$(echo "$LATEST_RELEASE" | sed -E 's/^LibCURL-v([^+]+)\+.*/\1/')

          if [ -z "$BASE_VERSION" ] || ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Warning: Failed to parse version from $LATEST_RELEASE, using pyproject.toml"
            VERSION=$(python3 -c "import re, pathlib; text = pathlib.Path('pyproject.toml').read_text(); m = re.search(r'version = \"(.+?)\"', text); print(m.group(1))")
          else
            echo "Latest LibCURL: $BASE_VERSION"
            CURRENT_VER=$(python3 -c "import re, pathlib; text = pathlib.Path('pyproject.toml').read_text(); m = re.search(r'version = \"(.+?)\"', text); print(m.group(1))")
            CURRENT_BASE="${CURRENT_VER%.*}"
            if [ "$CURRENT_BASE" = "$BASE_VERSION" ]; then
              VERSION="$CURRENT_VER"
            else
              VERSION="${BASE_VERSION}.1"
            fi
          fi
          fi

          PUBLISH="false"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            PUBLISH="true"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "publish=$PUBLISH" >> $GITHUB_OUTPUT
          echo "dry_run=${{ inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Publish: $PUBLISH, dry run: ${{ inputs.dry_run || 'false' }}"

  build-sdist:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Set version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.setup.outputs.version }}\"/" pyproject.toml

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    needs: setup
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: i686
            cibw_archs: i686
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_archs: aarch64
          - os: windows-latest
            arch: x86_64
            cibw_archs: AMD64
          - os: macos-15
            arch: arm64
            cibw_archs: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ needs.setup.outputs.version }}\"/" pyproject.toml

      - name: Ensure Homebrew libcurl matches pyproject (macOS)
        if: runner.os == 'macOS'
        run: |
          bash tools/brew_curl.sh --release

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-wheel-linux-x86_64:
    # Its own job (not part of the build-wheels matrix) so px-scenarios can
    # start as soon as this one wheel exists instead of waiting on the full
    # matrix (aarch64 and macOS runners are consistently the slowest).
    needs: setup
    name: Build ubuntu-latest x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set version
        shell: bash
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"${{ needs.setup.outputs.version }}\"/" pyproject.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-latest-x86_64
          path: wheelhouse/*.whl

  px-scenarios:
    # A dry run is a release rehearsal, so it runs the same consumer regression
    # gate. Normal devel dispatches do not need the Docker scenario environment.
    if: needs.setup.outputs.dry_run == 'true' || (needs.setup.outputs.publish == 'true' && github.ref == 'refs/heads/main')
    needs: [setup, build-wheel-linux-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve latest px release tag
        id: px-tag
        run: |
          # px marks its newest GitHub releases "Pre-release" even though
          # they are what ships to PyPI and what users install, so `gh
          # release view` (latest non-prerelease) would resolve a stale
          # version here; the newest v* tag is the actual latest release.
          TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/genotrance/px.git 'v*' \
            | head -n1 | sed 's#.*refs/tags/##')
          if [ -z "$TAG" ]; then
            echo "Could not resolve the latest px release tag" >&2
            exit 1
          fi
          echo "Testing against px release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out px scenario suite
        uses: actions/checkout@v7
        with:
          repository: genotrance/px
          ref: ${{ steps.px-tag.outputs.tag }}
          path: px

      - name: Download Linux candidate wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-latest-x86_64
          path: wheelhouse

      - name: Select the candidate wheel
        env:
          EXPECTED_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          shopt -s nullglob
          WHEELS=( wheelhouse/pymcurl-*-cp39-abi3-*manylinux*x86_64*.whl )
          if [ ${#WHEELS[@]} -ne 1 ]; then
            echo "Expected exactly one manylinux x86_64 cp39-abi3 wheel, found ${#WHEELS[@]}"
            echo "Available wheels:"
            ls wheelhouse/*.whl 2>/dev/null || echo "No wheels found"
            exit 1
          fi
          CANDIDATE_VERSION=$(basename "${WHEELS[0]}" | cut -d- -f2)
          if [ "$CANDIDATE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Expected pymcurl candidate version $EXPECTED_VERSION, found $CANDIDATE_VERSION"
            exit 1
          fi
          mkdir -p "${{ runner.temp }}/mcurl-candidate-wheel"
          cp "${WHEELS[0]}" "${{ runner.temp }}/mcurl-candidate-wheel/"

      - name: Bring up the corporate proxy scenario environment
        working-directory: px
        run: tests/scenarios/env/scenario-env.sh up

      # px's scenario client runs pytest and every Px it starts inside the
      # lab's private Docker network, which is why this can no longer run on
      # the runner itself (it cannot resolve lab hostnames such as
      # squid-basic). scenario-env.sh test bind-mounts the px checkout into
      # the client container, copies the candidate wheel directory in at the
      # same path, and installs exactly pymcurl==<version> from that wheel
      # after uv sync. The "Select the candidate wheel" step above checks that
      # the sole wheel's filename version matches the setup job's version, so
      # the client runs the candidate version.
      #
      # This runs only the cases that exercise mcurl's own auth and upload
      # code paths, not px's full lab matrix (burst/load, 100mb, two-workers,
      # RSS, all-methods-echo, authretry/lockout timing, PAC, connection
      # limits, long-lived tunnels): NTLM/Negotiate/Kerberos/Basic/Digest
      # credential and 407 flows, a Kerberos ticket-cache run, the Negotiate
      # SPN regression, streamed uploads on a fresh and on a warm Px across
      # every auth scheme (small bodies only), and one CONNECT case. px's
      # UPLOAD_LOOPS collapses to a single event loop when PX_EVENT_LOOP is
      # set, so this also runs each upload case once (with "auto", Px's own
      # default) instead of twice.
      - name: Run px corporate proxy scenarios
        working-directory: px
        env:
          MCURL_WHEELS: ${{ runner.temp }}/mcurl-candidate-wheel
          PX_EVENT_LOOP: auto
        run: |
          tests/scenarios/env/scenario-env.sh test \
            tests/scenarios/test_corporate_proxy.py::test_px_test_credentials \
            tests/scenarios/test_corporate_proxy.py::test_kerberos_ticket_no_password \
            tests/scenarios/test_corporate_proxy.py::test_px_test_auth_negotiate_matches_upstream_spn \
            "tests/scenarios/test_corporate_proxy.py::test_proxy_chain[https-connect]" \
            tests/scenarios/test_corporate_proxy.py::test_upload_first_request \
            tests/scenarios/test_corporate_proxy.py::test_upload_later_requests \
            -v --durations=30 --basetemp=/tmp/px-scenario-tmp

      - name: Collect px scenario logs
        if: failure()
        working-directory: px
        run: |
          mkdir -p "${{ runner.temp }}/px-scenario-artifacts"
          tests/scenarios/env/scenario-env.sh logs > "${{ runner.temp }}/px-scenario-artifacts/compose.log" 2>&1 || true
          tests/scenarios/env/scenario-env.sh artifacts "${{ runner.temp }}/px-scenario-artifacts" || true

      - name: Upload px scenario logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: px-scenario-logs
          path: ${{ runner.temp }}/px-scenario-artifacts
          retention-days: 7

      - name: Clean up px scenario environment
        if: always()
        working-directory: px
        run: tests/scenarios/env/scenario-env.sh down

  publish:
    needs: [setup, build-sdist, build-wheels, build-wheel-linux-x86_64, px-scenarios]
    if: needs.setup.outputs.publish == 'true' && github.ref == 'refs/heads/main' && needs.px-scenarios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Verify committed release version
        env:
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          COMMITTED_VERSION=$(git show "${RELEASE_SHA}:pyproject.toml" | python3 -c "import re, sys; m = re.search(r'^version = \"(.+?)\"', sys.stdin.read(), re.M); print(m.group(1))")
          if [ "$COMMITTED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Refusing to publish: pyproject.toml at $RELEASE_SHA declares $COMMITTED_VERSION, but the resolved release version is $RELEASE_VERSION."
            exit 1
          fi

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: Verify artifacts and release state
        id: state
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          for f in dist/*; do
            case "$(basename "$f")" in
              pymcurl-"$VERSION"[.-]*) ;;
              *) echo "::error::Artifact $f does not match version $VERSION"; exit 1 ;;
            esac
          done
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "https://pypi.org/pypi/pymcurl/$VERSION/json")
          case "$CODE" in
            200) echo "on_pypi=true" >> "$GITHUB_OUTPUT"; echo "pymcurl $VERSION is already on PyPI, skipping upload." ;;
            404) echo "on_pypi=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected PyPI response $CODE"; exit 1 ;;
          esac

      - name: Report dry-run publish plan
        if: needs.setup.outputs.dry_run == 'true'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          ON_PYPI: ${{ steps.state.outputs.on_pypi }}
        run: |
          if [ "$ON_PYPI" = true ]; then
            echo "::notice::Dry run: pymcurl $VERSION is already on PyPI; would only create a missing tag."
          else
            echo "::notice::Dry run: would upload pymcurl $VERSION and create its tag after the upload."
          fi

      - name: Publish to PyPI
        if: steps.state.outputs.on_pypi == 'false' && needs.setup.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create and push tag
        if: needs.setup.outputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.setup.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG" "$(git rev-parse HEAD)"
            git push origin "$TAG"
          fi

  back-merge:
    needs: [setup, publish]
    if: needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: devel
          fetch-depth: 0

      - name: Merge main into devel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main devel
          git checkout --detach origin/devel
          if git merge-base --is-ancestor "$RELEASE_SHA" origin/devel; then
            echo "devel already contains $RELEASE_SHA; nothing to merge." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MERGED=true
          git merge --no-ff --no-edit -m "Merge main (v$VERSION) into devel" "$RELEASE_SHA" || MERGED=false
          if [ "$DRY_RUN" = true ]; then
            if [ "$MERGED" = true ]; then
              echo "Dry run: main would merge cleanly into devel." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Dry run: merging main into devel would conflict; a back-merge PR would be needed." | tee -a "$GITHUB_STEP_SUMMARY"
              git merge --abort
            fi
            exit 0
          fi
          if [ "$MERGED" = true ] && git push origin HEAD:devel; then
            echo "Merged main (v$VERSION) into devel." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$MERGED" = true ] || git merge --abort
          BRANCH="back-merge/v$VERSION"
          git push origin "$RELEASE_SHA:refs/heads/$BRANCH"
          COMPARE="$REPO_URL/compare/devel...$BRANCH"
          if gh pr create --base devel --head "$BRANCH" \
            --title "Merge main (v$VERSION) into devel" \
            --body "Automatic back-merge after releasing v$VERSION failed (conflict or rejected push). Resolve and merge into devel."; then
            echo "::error::Back-merge of v$VERSION into devel failed; opened a PR from $BRANCH."
          else
            echo "::error::Back-merge of v$VERSION into devel failed and no PR could be opened; merge branch $BRANCH manually: $COMPARE"
          fi
          echo "Back-merge failed; branch $BRANCH, compare: $COMPARE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
