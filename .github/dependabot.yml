version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "cffi"
      - dependency-name: "pytest"
        versions: [">= 9"]
      - dependency-name: "jsonschema"
        versions: [">= 4.18"]
